<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Find professors, teaching rooms, subjects, and student group schedules."><title>Faculty Timetable | Astana IT University</title>
<style>
:root{--blue:#1264a3;--navy:#173b57;--ink:#243648;--muted:#627586;--line:#dce5ed;--bg:#f3f6f9;--orange:#e79a2e}*{box-sizing:border-box}body{margin:0;font:14px/1.5 'Segoe UI',Arial,sans-serif;color:var(--ink);background:var(--bg)}button,input,select,textarea{font:inherit}button,a{touch-action:manipulation}button{cursor:pointer}button:disabled{opacity:.6;cursor:wait}a{color:var(--blue)}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #e79a2e;outline-offset:3px}button{border:1px solid var(--line);background:white;border-radius:5px;padding:9px 14px;color:var(--ink)}button:hover{background:#edf4f9}button.primary{background:var(--blue);border-color:var(--blue);color:white}button.primary:hover{background:#0d5289}.danger{color:#a32626}header{height:70px;background:white;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 30px;gap:20px}.brand{display:flex;gap:12px;align-items:center;text-decoration:none;color:var(--navy);font-size:21px;font-weight:600}.topright{display:flex;align-items:center;gap:20px}.topright span{color:var(--muted);font-size:12px}.avatar{width:33px;height:33px;border-radius:50%;background:#e4eef6;color:var(--blue);display:grid;place-items:center;font-weight:600}.shell{display:flex;min-height:calc(100vh - 70px)}aside{width:224px;flex-shrink:0;background:var(--navy);color:#cbd9e5;padding:28px 16px;display:flex;flex-direction:column}.sidelabel{font-size:12px;color:#a6bdce;margin:0 12px 12px}.navbutton{border:0;background:transparent;color:#dbe6ef;display:flex;align-items:center;gap:12px;text-align:left;width:100%;margin:3px 0;padding:12px 15px;border-radius:5px}.navbutton:hover{background:#234b69}.navbutton.active{color:white;background:#2a587a;border-left:3px solid var(--orange);padding-left:12px}.navbutton svg{width:18px;height:18px}.adminnav{border-top:1px solid #365770;margin-top:25px;padding-top:20px}main{flex:1;min-width:0;padding:30px 34px 45px;max-width:1800px}.breadcrumb{font-size:12px;color:var(--muted);margin-bottom:20px}.breadcrumb span{margin:0 8px;color:#9caebb}.heading{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:24px}h1{margin:0 0 6px;font-size:29px;font-weight:650;letter-spacing:-.65px}h2{font-size:18px;margin:0}p{margin:0;color:var(--muted)}.heading-actions{display:flex;gap:8px}.notice{padding:12px 16px;border:1px solid #d5e3ed;background:#eaf2f8;border-radius:5px;margin-bottom:20px;display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:13px}.notice strong{color:#335976}.notice.error{background:#fff1f1;border-color:#edc5c5;color:#923232}.panel{background:white;border:1px solid var(--line);border-radius:7px}.tools{padding:18px 20px;display:flex;gap:12px;flex-wrap:wrap;align-items:end;border-bottom:1px solid var(--line)}.field{display:flex;flex-direction:column;gap:6px}.field label{font-size:12px;font-weight:600;color:#506477}input,select,textarea{padding:9px 11px;border:1px solid #ccd8e2;border-radius:5px;color:var(--ink);background:white;min-height:39px;max-width:100%}.searchfield{flex:1;min-width:190px}.tools select{min-width:155px}.tools .reset{border:0;color:var(--blue);margin-bottom:1px}.panelbar{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line)}.panelbar p{font-size:12px;margin-top:3px}.segmented{display:flex;border:1px solid var(--line);border-radius:5px;overflow:hidden}.segmented button{border:0;border-radius:0;padding:7px 13px}.segmented button.active{background:#e8f1f8;color:var(--blue);font-weight:600}.calendarwrap{overflow:auto;padding:0 16px 16px}.calendar{display:grid;grid-template-columns:55px repeat(6,minmax(135px,1fr));min-width:920px}.dayhead{padding:15px 8px;text-align:center;border-bottom:1px solid var(--line);font-size:13px;font-weight:600}.dayhead.today{color:var(--blue);background:#f1f7fc}.timeline{position:relative;height:704px}.timelabel{position:absolute;color:#7a8e9e;font-size:11px;top:var(--top)}.daycolumn{position:relative;height:704px;border-left:1px solid #e4ebf1;background:repeating-linear-gradient(to bottom,transparent 0px,transparent 63px,#edf1f5 63px,#edf1f5 64px)}.classcard{position:absolute;top:var(--top);height:var(--height);left:5px;right:5px;width:calc(100% - 10px);overflow:hidden;border:1px solid #cbdff0;border-left:3px solid #367db6;border-radius:4px;background:#edf5fc;padding:7px 9px;text-align:left;font-size:11px;line-height:1.4}.classcard:hover{background:#dfeefa}.classcard strong{display:block;font-size:12px;color:#214e72;line-height:1.25;margin:4px 0}.classcard .prof{display:block;color:#3c586c}.classcard .room{display:block;margin-top:5px;color:#536f80}.classcard.lab{background:#eef7f2;border-color:#d1e5d9;border-left-color:#4c946e}.classcard.lab strong{color:#34664b}.classcard.seminar{background:#f4f0fb;border-color:#dfd5ee;border-left-color:#8a6db2}.classcard.seminar strong{color:#6d538f}.badge{display:inline-block;padding:2px 7px;border-radius:3px;font-size:11px;background:#eaf2f8;color:#32658c;margin:2px 3px 2px 0}.legend{display:flex;gap:16px;align-items:center;padding:14px 20px;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}.dot{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px;background:#367db6}.dot.lab{background:#4c946e}.dot.seminar{background:#8a6db2}.count{margin-left:auto}.tablewrap{overflow:auto}table{border-collapse:collapse;width:100%;white-space:nowrap}th{text-align:left;background:#f7f9fb;font-size:12px;color:#63788a;font-weight:600}td,th{padding:14px 18px;border-bottom:1px solid #e7edf2}td{font-size:13px}td strong{display:block;font-weight:600}td small{display:block;color:var(--muted)}td .actions{display:flex;gap:6px}.empty{text-align:center;padding:65px 24px;color:var(--muted)}.empty h2{color:var(--ink);margin-bottom:8px}.empty button{margin-top:20px}.directory{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:15px;padding:20px}.person{border:1px solid var(--line);padding:20px;border-radius:6px;background:white;text-align:left}.person .avatar{margin-bottom:14px;width:42px;height:42px}.person h2{font-size:16px;margin-bottom:6px}.person p{font-size:12px}.person .link{display:block;margin-top:15px;color:var(--blue);font-size:13px}.adminintro{padding:20px;border-bottom:1px solid var(--line)}.adminintro p{margin-top:5px}.adminintro button{margin-top:16px}dialog{border:0;border-radius:9px;width:min(660px,calc(100% - 28px));padding:0;max-height:calc(100vh - 40px);color:var(--ink);box-shadow:0 20px 80px #102f5140}dialog::backdrop{background:#17334c80}.modalhead{padding:22px 24px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}.modalhead button{border:0;font-size:22px;padding:0 8px}.modalbody{padding:24px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.wide{grid-column:1/-1}.hint{font-size:11px;color:var(--muted)}.modalfoot{padding:17px 24px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:9px;background:#f9fbfc}.formerror{color:#9d2828;background:#fff1f1;padding:12px;margin-top:16px;border-radius:4px;font-size:13px}.details{display:grid;grid-template-columns:110px 1fr;gap:14px}.details dt{color:var(--muted)}.details dd{margin:0;overflow-wrap:anywhere}.details dt,.details dd{font-size:14px}#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);padding:12px 22px;background:var(--navy);color:white;border-radius:6px;z-index:20;box-shadow:0 4px 20px #173b5725}.muted{color:var(--muted)}[hidden]{display:none!important}.busy{padding:65px;text-align:center;color:var(--muted)}.skip{position:absolute;left:-1000px}.skip:focus{left:10px;top:8px;background:white;padding:10px;z-index:30}
@media(max-width:1000px){aside{width:190px}main{padding:24px 20px}.topright span{display:none}.heading{align-items:flex-start}.heading-actions{flex-wrap:wrap;justify-content:flex-end}.tools select{min-width:130px}}
@media(max-width:700px){header{padding:12px 16px;height:auto;min-height:62px;flex-wrap:wrap;gap:12px}.brand{font-size:18px;line-height:1.3}.topright{gap:10px}.topright>button{padding:7px 9px;font-size:12px}.shell{display:block}aside{width:100%;padding:8px;background:var(--navy);display:flex;flex-direction:row;gap:4px;overflow:auto}.sidelabel,.navbutton{margin:0;white-space:nowrap;padding:10px;font-size:12px;width:auto}.navbutton.active{border-left:0;border-bottom:2px solid var(--orange);padding-left:10px}.navbutton svg{display:none}.adminnav{margin:0;padding:0;border:0}main{padding:20px 14px}.breadcrumb{margin-bottom:14px}h1{font-size:25px}.heading{flex-direction:column;gap:12px;margin-bottom:20px}.heading-actions{width:100%;justify-content:flex-start}.tools{padding:14px;gap:10px}.tools .field{flex:1;min-width:130px}.searchfield{flex-basis:100%!important}.panelbar{padding:14px}.notice{align-items:flex-start}.calendarwrap{padding:0 7px 7px}.formgrid{grid-template-columns:1fr}.wide{grid-column:auto}.modalbody{padding:18px}.modalhead{padding:18px}.legend{flex-wrap:wrap;gap:10px}.count{width:100%;margin-left:0}.topright .avatar{display:none}td,th{padding:12px}.directory{padding:14px}}
@media print{header,aside,.tools,.heading-actions,.notice,.segmented,.actions{display:none}main{padding:0}.panel{border:0}.calendarwrap{overflow:visible}.calendar{min-width:0}.classcard{print-color-adjust:exact}}
.brand img{display:block;width:124px;height:54px;object-fit:contain}.heading{margin-top:0}header{min-height:74px;height:auto;padding-top:10px;padding-bottom:10px}@media(max-width:700px){header{flex-wrap:wrap;gap:10px}.brand img{width:110px;height:48px}}
</style></head><body>
<a class="skip" href="#main">Skip to timetable</a><header><a href="/" class="brand" aria-label="Astana IT University"><img src="/assets/aitu-logo.svg" alt="Astana IT University" width="124" height="54"></a><div class="topright"><button onclick="navigate('admin')"><span id="adminLabel">Admin sign in</span></button><button id="signOut" hidden onclick="signOut()">Sign out</button></div></header>
<div class="shell"><aside><div><button class="navbutton active" data-page="schedule" onclick="navigate('schedule')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 3v4M17 3v4M3 11h18"/></svg>Teaching schedule</button><button class="navbutton" data-page="professors" onclick="navigate('professors')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="8" r="4"/><path d="M4 21v-2a8 8 0 0116 0v2"/></svg>Professors</button><button class="navbutton" data-page="rooms" onclick="navigate('rooms')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 21V3h16v18M9 21v-5h6v5M8 7h2m4 0h2M8 11h2m4 0h2"/></svg>Teaching rooms</button></div><div class="adminnav"><button class="navbutton" data-page="admin" onclick="navigate('admin')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M12 3l8 4v5c0 5-8 9-8 9s-8-4-8-9V7z"/><path d="M8 12l3 3 5-6"/></svg>Administration</button></div></aside>
<main id="main"><div class="heading"><div><h1 id="title">Teaching schedule</h1></div><div class="heading-actions"><button onclick="downloadCSV()">Export schedule</button><button data-admin hidden class="primary" onclick="openEditor()">? Add class</button></div></div>
<div id="status" role="status" class="notice" hidden></div>
<section class="panel" aria-label="Schedule browser"><div class="tools" id="filters"><div class="field searchfield"><label for="search">Search timetable</label><input id="search" placeholder="Professor, subject, room or group?" oninput="renderContent()"></div><div class="field"><label for="professorFilter">Professor</label><select id="professorFilter" onchange="renderContent()"><option value="">All professors</option></select></div><div class="field"><label for="groupFilter">Student group</label><select id="groupFilter" onchange="renderContent()"><option value="">All groups</option></select></div><div class="field"><label for="dayFilter">Day</label><select id="dayFilter" onchange="renderContent()"><option value="">All days</option><option value="1">Monday</option><option value="2">Tuesday</option><option value="3">Wednesday</option><option value="4">Thursday</option><option value="5">Friday</option><option value="6">Saturday</option></select></div><button class="reset" onclick="resetFilters()">Reset</button></div><div class="panelbar" id="viewbar"><div><h2>Weekly timetable</h2></div><div class="segmented"><button id="weekButton" class="active" onclick="setView('week')" aria-pressed="true">Week</button><button id="listButton" onclick="setView('list')" aria-pressed="false">List</button></div></div><div id="content" class="busy">Loading your timetable?</div><div id="legend" class="legend"><span><i class="dot"></i>Lecture</span><span><i class="dot seminar"></i>Seminar</span><span><i class="dot lab"></i>Lab</span><span class="count" id="count"></span></div></section>
</main></div>
<dialog id="editor"><form id="classForm"><div class="modalhead"><h2 id="editorTitle">Add a class</h2><button type="button" aria-label="Close" onclick="document.getElementById('editor').close()">&times;</button></div><div class="modalbody"><div class="formgrid"><div class="field"><label for="fprofessor">Professor *</label><input id="fprofessor" name="professor" required maxlength="120" list="professorNames" placeholder="Professor name"><datalist id="professorNames"></datalist></div><div class="field"><label for="fsubject">Subject *</label><input id="fsubject" name="subject" required maxlength="120" placeholder="Subject name"></div><div class="field"><label for="froom">Room *</label><input id="froom" name="room" required maxlength="120" list="roomNames" placeholder="Room"><datalist id="roomNames"></datalist></div><div class="field"><label for="fkind">Class type</label><select id="fkind" name="kind"><option>Lecture</option><option>Seminar</option><option>Lab</option><option>Office hours</option></select></div><div class="field wide"><label for="fgroups">Student group or groups *</label><input id="fgroups" name="groups" required placeholder="Group names, separated by commas"><span class="hint">Separate multiple groups with commas.</span></div><div class="field wide"><label for="fday">Day *</label><select id="fday" name="day"><option value="1">Monday</option><option value="2">Tuesday</option><option value="3">Wednesday</option><option value="4">Thursday</option><option value="5">Friday</option><option value="6">Saturday</option></select></div><div class="field"><label for="fstart">Start time *</label><input id="fstart" name="start" type="time" value="09:00" required></div><div class="field"><label for="fend">End time *</label><input id="fend" name="end" type="time" value="10:30" required></div><div class="field wide"><label for="fnotes">Notes</label><textarea id="fnotes" name="notes" rows="3" maxlength="2000" placeholder="Optional teaching or room information"></textarea></div></div><div id="formError" class="formerror" role="alert" hidden></div></div><div class="modalfoot"><button type="button" onclick="document.getElementById('editor').close()">Cancel</button><button class="primary" id="saveButton" type="submit">Save class</button></div></form></dialog>
<dialog id="details"><div class="modalhead"><h2 id="detailTitle">Class details</h2><button aria-label="Close" onclick="document.getElementById('details').close()">&times;</button></div><div class="modalbody" id="detailBody"></div><div class="modalfoot"><button onclick="document.getElementById('details').close()">Close</button><button id="detailEdit" class="primary">Edit class</button></div></dialog>
<dialog id="deleteDialog"><div class="modalhead"><h2>Delete this class?</h2></div><div class="modalbody"><p id="deleteText"></p><div id="deleteError" class="formerror" role="alert" hidden></div></div><div class="modalfoot"><button onclick="document.getElementById('deleteDialog').close()">Cancel</button><button class="danger" id="confirmDelete">Delete class</button></div></dialog>
<dialog id="loginDialog"><form id="loginForm"><div class="modalhead"><h2>Admin sign in</h2><button type="button" aria-label="Close" onclick="document.getElementById('loginDialog').close()">&times;</button></div><div class="modalbody"><div class="formgrid"><div class="field wide"><label for="loginEmail">Email</label><input id="loginEmail" type="email" autocomplete="username" required></div><div class="field wide"><label for="loginPassword">Password</label><input id="loginPassword" type="password" autocomplete="current-password" required></div></div><div id="loginError" class="formerror" role="alert" hidden></div></div><div class="modalfoot"><button type="button" onclick="document.getElementById('loginDialog').close()">Cancel</button><button id="loginButton" class="primary">Sign in</button></div></form></dialog><div id="toast" role="status" hidden></div>
<script defer src="/app.js"></script></body></html>
